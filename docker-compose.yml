services:
  postgres:
    image: postgres:17-alpine
    container_name: stadiumlive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stadiumlive
      POSTGRES_USER: stadiumlive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stadiumlive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stadiumlive -d stadiumlive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stadiumlive_postgres_data:
